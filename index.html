<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="FoodDash delivers meals from the best local restaurants in Dhaka, Chattogram and Sylhet. Explore cuisines, order in minutes and track your delivery live." />
    <meta name="theme-color" content="#7D40FF" />
    <link rel="preconnect" href="https://www.themealdb.com" />
    <title>FoodDash: Order food from local restaurants</title>
    <script>
      // apply the saved theme before first paint to avoid a flash
      try {
        const t = localStorage.getItem("fooddash-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
